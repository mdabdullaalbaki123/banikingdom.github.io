  .drawer-guest-note { color:var(--muted); font-size:0.7rem; text-align:center; margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }

  /* ---------- local (guest) prefs & activity ---------- */
  var PREFS_KEY = "bani-kingdom-prefs";
  var ACTIVITY_KEY = "bani-kingdom-activity";
  function loadPrefs() { try { var r = localStorage.getItem(PREFS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify({ lang: state.lang, theme: state.theme })); } catch (e) {} }
  function loadLocalActivity() { try { var r = localStorage.getItem(ACTIVITY_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function saveLocalActivity() { try { localStorage.setItem(ACTIVITY_KEY, JSON.stringify({ history: state.history, watchLater: state.watchLater })); } catch (e) {} }

  /* ---------- state ---------- */
  var savedPrefs = loadPrefs();
  var savedLocalActivity = loadLocalActivity();
  var state = {
    links: [], categories: DEFAULT_CATEGORY_KEYS.slice(), adminHash: null, adminEmail: null,
    background: null, media: [], siteName: "BANI KINGDOM ♔", siteLoaded: false,
    lang: (savedPrefs && savedPrefs.lang) || "bn",
    theme: (savedPrefs && savedPrefs.theme) || "dark",
    history: (savedLocalActivity && savedLocalActivity.history) || [],
    watchLater: (savedLocalActivity && savedLocalActivity.watchLater) || [],
    currentUser: null,
    isAdmin: false,
    activeCategory: "__all__",
    drawerTab: "history",
    saveError: false
  };

  function t() { return STR[state.lang]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function faviconFor(url) {
    try { var u = new URL(url); return "https://www.google.com/s2/favicons?domain=" + u.hostname + "&sz=64"; }
    catch (e) { return null; }
  }
  function parseDriveId(url) {
    var patterns = [/\/d\/([a-zA-Z0-9_-]{15,})/, /[?&]id=([a-zA-Z0-9_-]{15,})/];
    for (var i = 0; i < patterns.length; i++) {
      var m = url.match(patterns[i]);
      if (m) return m[1];
    }
    return null;
  }

  /* ---------- Firestore: shared site data (real-time) ---------- */
  siteRef.onSnapshot(function (doc) {
    if (doc.exists) {
      var d = doc.data();
      state.links = d.links || [];
      state.categories = (d.categories && d.categories.length) ? d.categories : DEFAULT_CATEGORY_KEYS.slice();
      state.adminHash = d.adminHash || null;
      state.adminEmail = d.adminEmail || null;
      state.background = d.background || null;
      state.media = d.media || [];
      state.siteName = d.siteName || "BANI KINGDOM ♔";
    }
    state.siteLoaded = true;
    state.saveError = false;
    render();
  }, function () {
    state.siteLoaded = true;
    state.saveError = true;
    render();
  });

  function patchSite(fields) {
    siteRef.set(fields, { merge: true }).catch(function () {
      state.saveError = true;
      render();
    });
  }

  /* ---------- Firestore: per-user activity (when signed in) ---------- */
  function subscribeUser(uid) {
    if (userUnsub) userUnsub();
    userUnsub = db.collection("users").doc(uid).onSnapshot(function (doc) {
      var d = doc.exists ? doc.data() : {};
      state.history = d.history || [];
      state.watchLater = d.watchLater || [];
      render();
      if (document.querySelector(".drawer")) renderDrawer();
    });
  }
  function saveActivity() {
    if (state.currentUser) {
      db.collection("users").doc(state.currentUser.uid).set({
        history: state.history, watchLater: state.watchLater,
        displayName: state.currentUser.displayName || null,
        email: state.currentUser.email || null,
        photoURL: state.currentUser.photoURL || null
      }, { merge: true });
    } else {
      saveLocalActivity();
    }
  }

  auth.onAuthStateChanged(function (user) {
    state.currentUser = user;
    if (user) {
      subscribeUser(user.uid);
    } else {
      if (userUnsub) { userUnsub(); userUnsub = null; }
      var la = loadLocalActivity();
      state.history = (la && la.history) || [];
      state.watchLater = (la && la.watchLater) || [];
    }
    render();
  });

  function signInGoogle(onDone) {
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(function (result) {
      if (onDone) onDone(null, result.user);
    }).catch(function (err) {
      if (onDone) onDone(err, null);
    });
  }
  function signOutGoogle() { auth.signOut(); state.isAdmin = false; render(); }

  /* ---------- clock ---------- */
  function clockHtml() {
    var now = new Date();
    var locale = state.lang === "bn" ? "bn-BD" : "en-US";
    var time = now.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    var date = now.toLocaleDateString(locale, { weekday: "long", day: "numeric", month: "long" });
    return '<div class="clock mono"><span class="time">' + time + '</span><span class="date">' + esc(date) + '</span></div>';
  }
  setInterval(function () {
    var el = document.getElementById("clock-slot");
    if (el) el.innerHTML = clockHtml();
  }, 1000);

  /* ---------- background application ---------- */
  function applyBackground() {
    var bg = state.background;
    if (bg && bg.type === "image" && bg.value) {
      document.body.style.background = "";
      document.body.style.backgroundImage = "linear-gradient(var(--overlay), var(--overlay)), url('" + bg.value.replace(/'/g, "%27") + "')";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
    } else if (bg && bg.type === "color" && bg.value) {
      document.body.style.backgroundImage = "";
      document.body.style.background = bg.value;
    } else {
      document.body.style.backgroundImage = "";
      document.body.style.background = "";
    }
  }

  /* ---------- rendering ---------- */
  function render() {
    document.documentElement.setAttribute("data-theme", state.theme);
    document.documentElement.setAttribute("lang", state.lang === "bn" ? "bn" : "en");
    applyBackground();
    var T = t();

    if (!state.siteLoaded) {
      document.getElementById("app").innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)"><span class="mono">' + esc(T.loading) + '</span></div>';
      return;
    }

    var adminControls = state.isAdmin
      ? '<button class="icon-btn" data-action="open-bg" title="' + esc(T.bgSettings) + '">🎨</button>' +
        '<button class="icon-btn" data-action="open-changepw" title="' + esc(T.changePassword) + '">🔑</button>' +
        '<button class="icon-btn primary" data-action="admin-logout" title="' + esc(T.logout) + '">🚪</button>'

    var userBtn = state.currentUser

          : '<button class="icon-btn" data-action="signout-user" title="' + esc(T.signOut) + '">👤</button>')
      : '<button class="icon-btn" data-action="signin-user" title="' + esc(T.signInGoogle) + '">👤</button>';

    var editNameBtn = state.isAdmin ? '<button class="edit-name-btn" data-action="open-name">✏️</button>' : "";

    var header =

        '</div>' +
        '<div class="controls">' +
          '<button class="icon-btn wide" data-action="toggle-lang">🌐 ' + (state.lang === "bn" ? "EN" : "বাং") + '</button>' +
          '<button class="icon-btn" data-action="toggle-theme">' + (state.theme === "dark" ? "☀️" : "🌙") + '</button>' +

    var errorBanner = state.saveError ? '<div class="save-error">' + esc(T.saveError) + '</div>' : "";

    var searchBar =
      '<div class="search-bar">' +
        '<span class="sicon">🔍</span>' +
        '<input id="search-input" type="text" placeholder="' + esc(T.searchPlaceholder) + '">' +
        '<button data-action="run-search">' + esc(T.searchBtn) + '</button>' +
      '</div>';

    var tabsHtml = '<div class="tabs">';
    tabsHtml += '<button class="tab' + (state.activeCategory === "__all__" ? " active" : "") + '" data-action="set-cat" data-cat="__all__">' + esc(T.all) + '</button>';
    state.categories.forEach(function (c) {
      tabsHtml += '<button class="tab' + (state.activeCategory === c ? " active" : "") + '" data-action="set-cat" data-cat="' + esc(c) + '">' + esc(catLabel(c, state.lang)) + '</button>';
    });

      tabsHtml += '<button class="add-channel" data-action="open-add-link">➕ ' + esc(T.addChannel) + '</button>';
    }
    tabsHtml += '</div>';

    var filtered = state.activeCategory === "__all__" ? state.links : state.links.filter(function (l) { return l.category === state.activeCategory; });
    var gridHtml;
    if (filtered.length === 0) {
      gridHtml = '<div class="empty"><p>' + esc(T.noLinks) + '</p>' + (!state.isAdmin ? '<p style="font-size:0.85rem">' + esc(T.loginToAdd) + '</p>' : '') + '</div>';
    } else {
      gridHtml = '<div class="grid">';
      filtered.forEach(function (link, i) {
        var fav = faviconFor(link.url);
        var isSaved = state.watchLater.some(function (w) { return w.id === link.id; });
        var adminActions = state.isAdmin
          ? '<button data-action="edit-link" data-id="' + esc(link.id) + '">✏️</button><button data-action="delete-link" data-id="' + esc(link.id) + '">🗑️</button>'
          : "";
        var actions =
          '<div class="card-top-right">' +
            '<button class="bookmark-btn" data-action="toggle-watch" data-id="' + esc(link.id) + '">' + (isSaved ? "★" : "☆") + '</button>' +
            adminActions +
          '</div>';
        gridHtml +=
          '<a class="card" href="' + esc(link.url) + '" target="_blank" rel="noopener noreferrer" data-action="log-link" data-id="' + esc(link.id) + '">' +
            '<div class="card-top"><span class="ch mono">' + esc(T.channelPrefix) + ' ' + String(i + 1).padStart(2, "0") + '</span>' + actions + '</div>' +
            '<div class="card-title">' + (fav ? '<img src="' + fav + '" alt="" onerror="this.style.display=\'none\'">' : '') + '<span>' + esc(link.title) + '</span></div>' +
            '<span class="card-cat mono">' + esc(catLabel(link.category, state.lang)) + '</span>' +
          '</a>';
      });
      gridHtml += '</div>';
    }

    var mediaAddBtn = state.isAdmin ? '<button class="add-channel" style="margin-left:0" data-action="open-add-media">➕ ' + esc(T.addMedia) + '</button>' : "";
    var mediaGrid;
    if (state.media.length === 0) {
      mediaGrid = '<div class="empty" style="padding:24px 16px;font-size:0.9rem">' + esc(T.noMedia) + '</div>';
    } else {
      mediaGrid = '<div class="media-grid">';
      state.media.forEach(function (m) {
        var driveId = m.driveId;
        var viewUrl = driveId ? ("https://drive.google.com/uc?export=view&id=" + driveId) : m.url;
        var downloadUrl = driveId ? ("https://drive.google.com/uc?export=download&id=" + driveId) : m.url;
        var previewUrl = driveId ? ("https://drive.google.com/file/d/" + driveId + "/preview") : m.url;
        var thumb = m.type === "video"
          ? '<iframe src="' + previewUrl + '" allow="autoplay"></iframe>'
          : '<img src="' + viewUrl + '" alt="' + esc(m.title) + '" onerror="this.style.opacity=0.2">';
        var delBtn = state.isAdmin ? '<button data-action="delete-media" data-id="' + esc(m.id) + '">🗑️</button>' : "";
        mediaGrid +=
          '<div class="media-card">' +
            '<div class="media-thumb">' + thumb + '</div>' +
            '<div class="media-meta"><span class="mtitle">' + esc(m.title) + '</span>' +
            '<span class="mactions"><a href="' + downloadUrl + '" target="_blank" rel="noopener noreferrer">⬇️</a>' + delBtn + '</span></div>' +
          '</div>';
      });
      mediaGrid += '</div>';
    }

    var footer = '<div class="footer-tag mono">' + esc(state.isAdmin ? T.adminModeOn : T.openToAll) + '</div>';

    document.getElementById("app").innerHTML =
      '<div class="wrap">' +
        header + errorBanner + searchBar + tabsHtml + gridHtml +
        '<h2 class="section-title">🖼️ ' + esc(T.media) + '</h2>' +
        '<div class="media-header">' + mediaAddBtn + '</div>' +
        mediaGrid + footer +
      '</div>';

    var si = document.getElementById("search-input");
    if (si) si.addEventListener("keydown", function (e) { if (e.key === "Enter") runSearch(); });
  }

  function runSearch() {
    var q = (document.getElementById("search-input") || {}).value || "";
    q = q.trim();
    if (!q) return;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  }

  /* ---------- modal helpers ---------- */
  function closeModal() { document.getElementById("modal-root").innerHTML = ""; }
  function openModal(html) {
    document.getElementById("modal-root").innerHTML =
      '<div class="overlay" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()">' + html + '</div></div>';
  }

  /* ---------- activity: history / watch later ---------- */
  function logHistory(id) {
    var link = state.links.find(function (l) { return l.id === id; });
    if (!link) return;
    state.history = state.history.filter(function (h) { return h.id !== id; });
    state.history.unshift({ id: link.id, title: link.title, url: link.url, ts: Date.now() });
    if (state.history.length > 50) state.history = state.history.slice(0, 50);
    saveActivity();
  }
  function toggleWatch(id) {
    var link = state.links.find(function (l) { return l.id === id; });
    if (!link) return;
    var exists = state.watchLater.some(function (w) { return w.id === id; });
    if (exists) {
      state.watchLater = state.watchLater.filter(function (w) { return w.id !== id; });
    } else {
      state.watchLater.unshift({ id: link.id, title: link.title, url: link.url });
    }
    saveActivity();
    render();
  }
  function removeWatch(id) {
    state.watchLater = state.watchLater.filter(function (w) { return w.id !== id; });
    saveActivity();
    renderDrawer();
  }
  function clearHistory() {
    state.history = [];
    saveActivity();
    renderDrawer();
  }

  /* ---------- drawer (History / Watch Later / Downloads) ---------- */
  function closeDrawer() { document.getElementById("drawer-root").innerHTML = ""; }
  function openDrawer(tabName) {
    state.drawerTab = tabName || "history";
    renderDrawer();
  }
  function renderDrawer() {
    var root = document.getElementById("drawer-root");
    if (!root.querySelector(".drawer")) {
      root.innerHTML = '<div class="drawer-overlay" data-action="close-drawer"></div><div class="drawer" onclick="event.stopPropagation()"></div>';
    }
    var T = t();
    var tabs = ["history", "watchLater", "downloads"];
    var tabLabels = { history: T.history, watchLater: T.watchLater, downloads: T.downloads };
    var tabsHtml = '<div class="drawer-tabs">' + tabs.map(function (tab) {
      return '<button class="' + (state.drawerTab === tab ? "active" : "") + '" data-action="drawer-tab" data-tab="' + tab + '">' + esc(tabLabels[tab]) + '</button>';
    }).join("") + '</div>';

    var body = "";
    if (state.drawerTab === "history") {
      if (state.history.length === 0) {
        body = '<div class="drawer-empty">' + esc(T.noHistory) + '</div>';
      } else {
        body = '<button class="drawer-clear" data-action="clear-history">' + esc(T.clearHistory) + '</button>';
        state.history.forEach(function (h) {
          body += '<div class="drawer-item"><a href="' + esc(h.url) + '" target="_blank" rel="noopener noreferrer">' + esc(h.title) + '</a></div>';
        });
      }
    } else if (state.drawerTab === "watchLater") {
      if (state.watchLater.length === 0) {
        body = '<div class="drawer-empty">' + esc(T.noWatchLater) + '</div>';
      } else {
        state.watchLater.forEach(function (w) {
          body += '<div class="drawer-item"><a href="' + esc(w.url) + '" target="_blank" rel="noopener noreferrer">' + esc(w.title) + '</a><button data-action="remove-watch" data-id="' + esc(w.id) + '">✖️</button></div>';
        });
      }
    } else {
      if (state.media.length === 0) {
        body = '<div class="drawer-empty">' + esc(T.noDownloads) + '</div>';
      } else {
        state.media.forEach(function (m) {
          var driveId = m.driveId;
          var downloadUrl = driveId ? ("https://drive.google.com/uc?export=download&id=" + driveId) : m.url;
          body += '<div class="drawer-item"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.title) + '</span><a href="' + downloadUrl + '" target="_blank" rel="noopener noreferrer" style="flex:none">⬇️</a></div>';
        });
      }
    }

    if (!state.currentUser) {
      body += '<div class="drawer-guest-note">' + esc(T.guestNote) + '</div>';
    }

    root.querySelector(".drawer").innerHTML =
      '<h2>' + esc(T.history) + '<button data-action="close-drawer">✖️</button></h2>' +
      tabsHtml + body;
  }

  /* ---------- link add/edit modal ---------- */
  function openLinkModal(mode, link) {
    var editingLink = link || { title: "", url: "", category: state.categories[0] || "" };
    var T = t();
    var catOptions = state.categories.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === editingLink.category ? " selected" : "") + '>' + esc(catLabel(c, state.lang)) + '</option>';
    }).join("");
    openModal(
      '<h2>' + esc(mode === "edit" ? T.editLink : T.addLink) + '<button data-action="close-modal">✖️</button></h2>' +
      '<label>' + esc(T.name) + '</label><input id="lm-title" type="text" placeholder="' + esc(T.namePlaceholder) + '" value="' + esc(editingLink.title) + '">' +
      '<label>' + esc(T.link) + '</label><input id="lm-url" type="text" placeholder="https://..." value="' + esc(editingLink.url) + '">' +
      '<label>' + esc(T.category) + '</label><select id="lm-cat">' + catOptions + '</select>' +
      '<input id="lm-newcat" type="text" placeholder="' + esc(T.orNewCategory) + '">' +
      '<button class="submit" data-action="save-link" data-mode="' + mode + '" data-id="' + esc(editingLink.id || "") + '">✔️ ' + esc(T.save) + '</button>'
    );
  }
  function submitLink(mode, id) {
    var title = document.getElementById("lm-title").value.trim();
    var url = document.getElementById("lm-url").value.trim();
    var cat = document.getElementById("lm-cat").value;
    var newCat = document.getElementById("lm-newcat").value.trim();
    if (!title || !url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    var finalCat = newCat || cat;
    var data = { id: id || Date.now().toString(), title: title, url: url, category: finalCat };
    var newLinks;
    if (mode === "edit") {
      newLinks = state.links.map(function (l) { return l.id === data.id ? data : l; });
    } else {
      newLinks = state.links.concat([data]);
    }
    var newCategories = state.categories;
    if (finalCat && state.categories.indexOf(finalCat) === -1) newCategories = state.categories.concat([finalCat]);
    closeModal();
    patchSite({ links: newLinks, categories: newCategories });
  }
  function deleteLink(id) {
    var newLinks = state.links.filter(function (l) { return l.id !== id; });
    patchSite({ links: newLinks });
  }

  /* ---------- auth modals ---------- */
  function openAuthModal() {
    var T = t();
    var hasPw = !!state.adminHash;
    openModal(
      '<h2>' + esc(hasPw ? T.adminLogin : T.adminSetup) + '<button data-action="close-modal">✖️</button></h2>' +
      (!hasPw ? '<p class="hint">' + esc(T.setupHint) + '</p>' : '') +
      '<label>' + esc(T.password) + '</label><input id="auth-pw" type="password">' +
      (!hasPw ? '<label>' + esc(T.confirmPassword) + '</label><input id="auth-pw2" type="password">' : '') +
      '<div id="auth-err" class="err"></div>' +
      '<button class="submit" data-action="submit-auth" data-haspw="' + hasPw + '">✔️ ' + esc(hasPw ? T.login : T.setupAndLogin) + '</button>' +
      '<div class="divider">' + esc(T.orDivider) + '</div>' +
      '<button class="google-btn" data-action="admin-google">🔵 ' + esc(T.continueWithGoogle) + '</button>'
    );
  }
  function submitAuth(hasPw) {
    var T = t();
    var pw = document.getElementById("auth-pw").value;
    var errEl = document.getElementById("auth-err");
    if (!hasPw) {
      var pw2 = document.getElementById("auth-pw2").value;
      if (pw.length < 4) { errEl.textContent = T.pwTooShort; return; }
      if (pw !== pw2) { errEl.textContent = T.pwMismatch; return; }
      state.isAdmin = true;
      closeModal();
      patchSite({ adminHash: hashPassword(pw) });
    } else {
      if (hashPassword(pw) === state.adminHash) {
        state.isAdmin = true;
        closeModal();
        render();
      } else {
        errEl.textContent = T.wrongPassword;
      }
    }
  }
  function adminViaGoogle() {
    var T = t();
    var errEl = document.getElementById("auth-err");
    signInGoogle(function (err, user) {
      if (err) { if (errEl) errEl.textContent = err.message; return; }
      if (!state.adminEmail) {
        state.isAdmin = true;
        closeModal();
        patchSite({ adminEmail: user.email });
      } else if (state.adminEmail === user.email) {
        state.isAdmin = true;
        closeModal();
        render();
      } else {
        closeModal();
        render();
        setTimeout(function () { alert(T.notAdminAccount); }, 100);
      }
    });
  }
  function openChangePwModal() {
    var T = t();
    openModal(
      '<h2>' + esc(T.changePasswordTitle) + '<button data-action="close-modal">✖️</button></h2>' +
      '<label>' + esc(T.currentPassword) + '</label><input id="cpw-old" type="password">' +
      '<label>' + esc(T.newPassword) + '</label><input id="cpw-new" type="password">' +
      '<label>' + esc(T.confirmNewPassword) + '</label><input id="cpw-confirm" type="password">' +
      '<div id="cpw-err" class="err"></div>' +
      '<button class="submit" data-action="submit-changepw">✔️ ' + esc(T.save) + '</button>'
    );
  }
  function submitChangePw() {
    var T = t();
    var oldPw = document.getElementById("cpw-old").value;
    var newPw = document.getElementById("cpw-new").value;
    var confirm = document.getElementById("cpw-confirm").value;
    var errEl = document.getElementById("cpw-err");
    if (hashPassword(oldPw) !== state.adminHash) { errEl.textContent = T.wrongCurrentPw; return; }
    if (newPw.length < 4) { errEl.textContent = T.pwTooShort; return; }
    if (newPw !== confirm) { errEl.textContent = T.pwMismatch; return; }
    closeModal();
    patchSite({ adminHash: hashPassword(newPw) });
  }

  /* ---------- background modal ---------- */
  function openBgModal() {
    var T = t();
    var bg = state.background;
    var type = (bg && bg.type) || "color";
    var color = (bg && bg.type === "color" && bg.value) || "#14121a";
    var img = (bg && bg.type === "image" && bg.value) || "";
    openModal(
      '<h2>' + esc(T.bgSettings) + '<button data-action="close-modal">✖️</button></h2>' +
      '<div class="seg">' +
        '<button data-action="bg-type" data-type="color" class="' + (type === "color" ? "active" : "") + '">' + esc(T.bgColorOption) + '</button>' +
        '<button data-action="bg-type" data-type="image" class="' + (type === "image" ? "active" : "") + '">' + esc(T.bgImageOption) + '</button>' +
      '</div>' +
      '<div id="bg-fields">' +
        (type === "color"
          ? '<label>' + esc(T.bgColorLabel) + '</label><input id="bg-color" type="color" value="' + color + '">'
          : '<label>' + esc(T.bgImageLabel) + '</label><input id="bg-image" type="text" placeholder="https://..." value="' + esc(img) + '">') +
      '</div>' +
      '<button class="submit" data-action="save-bg" data-type="' + type + '">✔️ ' + esc(T.apply) + '</button>'
    );
  }
  function switchBgType(type) {
    var T = t();
    var fields = document.getElementById("bg-fields");
    var submitBtn = document.querySelector('[data-action="save-bg"]');
    document.querySelectorAll('[data-action="bg-type"]').forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-type") === type);
    });
    submitBtn.setAttribute("data-type", type);
    if (type === "color") {
      fields.innerHTML = '<label>' + esc(T.bgColorLabel) + '</label><input id="bg-color" type="color" value="#14121a">';
    } else {
      fields.innerHTML = '<label>' + esc(T.bgImageLabel) + '</label><input id="bg-image" type="text" placeholder="https://...">';
    }
  }
  function saveBg(type) {
    var bg;
    if (type === "color") {
      bg = { type: "color", value: document.getElementById("bg-color").value };
    } else {
      var val = document.getElementById("bg-image").value.trim();
      if (!val) return;
      bg = { type: "image", value: val };
    }
    closeModal();
    patchSite({ background: bg });
  }

  /* ---------- site name modal ---------- */
  function openNameModal() {
    var T = t();
    openModal(
      '<h2>' + esc(T.siteNameSettings) + '<button data-action="close-modal">✖️</button></h2>' +
      '<label>' + esc(T.siteNameLabel) + '</label><input id="name-input" type="text" value="' + esc(state.siteName) + '">' +
      '<button class="submit" data-action="save-name">✔️ ' + esc(T.apply) + '</button>'
    );
  }
  function saveName() {
    var val = document.getElementById("name-input").value.trim();
    closeModal();
    patchSite({ siteName: val || "BANI KINGDOM ♔" });
  }

  /* ---------- media modal ---------- */
  function openMediaModal() {
    var T = t();
    openModal(
      '<h2>' + esc(T.addMedia) + '<button data-action="close-modal">✖️</button></h2>' +
      '<label>' + esc(T.mediaTitle) + '</label><input id="md-title" type="text">' +
      '<label>' + esc(T.mediaUrl) + '</label><input id="md-url" type="text" placeholder="https://drive.google.com/...">' +
      '<p class="hint">' + esc(T.driveHint) + '</p>' +
      '<label>' + esc(T.mediaTypeLabel) + '</label>' +
      '<div class="seg">' +
        '<button data-action="md-type" data-type="image" class="active">🖼️ ' + esc(T.image) + '</button>' +
        '<button data-action="md-type" data-type="video">🎬 ' + esc(T.video) + '</button>' +
      '</div>' +
      '<button class="submit" data-action="save-media" data-type="image">✔️ ' + esc(T.save) + '</button>'
    );
  }
  function switchMediaType(type) {
    document.querySelectorAll('[data-action="md-type"]').forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-type") === type);
    });
    document.querySelector('[data-action="save-media"]').setAttribute("data-type", type);
  }
  function saveMedia(type) {
    var title = document.getElementById("md-title").value.trim();
    var url = document.getElementById("md-url").value.trim();
    if (!title || !url) return;
    var driveId = parseDriveId(url);
    var newMedia = state.media.concat([{ id: Date.now().toString(), title: title, url: url, type: type, driveId: driveId || null }]);
    closeModal();
    patchSite({ media: newMedia });
  }
  function deleteMedia(id) {
    var newMedia = state.media.filter(function (m) { return m.id !== id; });
    patchSite({ media: newMedia });
  }

  /* ---------- event delegation ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    switch (action) {
      case "toggle-lang": state.lang = state.lang === "bn" ? "en" : "bn"; savePrefs(); render(); break;
      case "toggle-theme": state.theme = state.theme === "dark" ? "light" : "dark"; savePrefs(); render(); break;
      case "open-auth": openAuthModal(); break;
      case "submit-auth": submitAuth(el.getAttribute("data-haspw") === "true"); break;
      case "admin-google": adminViaGoogle(); break;
      case "admin-logout": state.isAdmin = false; render(); break;
      case "signin-user": signInGoogle(function (err) { if (err) alert(err.message); }); break;
      case "signout-user": signOutGoogle(); break;
      case "open-changepw": openChangePwModal(); break;
      case "submit-changepw": submitChangePw(); break;
      case "open-bg": openBgModal(); break;
      case "bg-type": switchBgType(el.getAttribute("data-type")); break;
      case "save-bg": saveBg(el.getAttribute("data-type")); break;
      case "open-name": openNameModal(); break;
      case "save-name": saveName(); break;
      case "open-add-link": openLinkModal("add", null); break;
      case "edit-link":
        e.preventDefault(); e.stopPropagation();
        var lid = el.getAttribute("data-id");
        var found = state.links.find(function (l) { return l.id === lid; });
        openLinkModal("edit", found); break;
      case "delete-link":
        e.preventDefault(); e.stopPropagation();
        deleteLink(el.getAttribute("data-id")); break;
      case "save-link": submitLink(el.getAttribute("data-mode"), el.getAttribute("data-id")); break;
      case "open-add-media": openMediaModal(); break;
      case "md-type": switchMediaType(el.getAttribute("data-type")); break;
      case "save-media": saveMedia(el.getAttribute("data-type")); break;
      case "delete-media": deleteMedia(el.getAttribute("data-id")); break;
      case "set-cat": state.activeCategory = el.getAttribute("data-cat"); render(); break;
      case "run-search": runSearch(); break;
      case "close-modal": closeModal(); break;
      case "open-menu": openDrawer("history"); break;
      case "close-drawer": closeDrawer(); break;
      case "drawer-tab": state.drawerTab = el.getAttribute("data-tab"); renderDrawer(); break;
      case "toggle-watch": e.preventDefault(); e.stopPropagation(); toggleWatch(el.getAttribute("data-id")); break;
      case "remove-watch": removeWatch(el.getAttribute("data-id")); break;
      case "clear-history": clearHistory(); break;
      case "log-link": logHistory(el.getAttribute("data-id")); break;
    }
  });

  render();
})();
</script>
</body>
</html>
